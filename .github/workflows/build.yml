name: Build ImperialShop

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImperialShop-${{ github.sha }}
          path: |
            paper/target/*.jar
            velocity/target/*.jar