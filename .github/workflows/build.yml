name: Build ImperialShop

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build all modules
        run: mvn -B -ntp clean package
      - name: Verify output names
        run: |
          test -f paper/target/imperialShop.jar
          test -f velocity/target/imperialShop-velocity.jar
      - name: Validate and package resource packs
        run: |
          test -f packs/java/pack.mcmeta
          test -f packs/java/assets/minecraft/textures/item/paper.png
          test -f packs/bedrock/manifest.json
          test -f packs/bedrock/textures/item_texture.json
          test -f packs/bedrock/textures/items/paper.png
          mkdir -p dist
          (cd packs/java && zip -qr ../../dist/imperialshop-java-pack.zip .)
          (cd packs/bedrock && zip -qr ../../dist/imperialshop-bedrock-pack.mcpack .)
      - name: Upload Java resource pack
        uses: actions/upload-artifact@v4
        with:
          name: imperialshop-java-resource-pack
          path: dist/imperialshop-java-pack.zip
          if-no-files-found: error
      - name: Upload Bedrock resource pack
        uses: actions/upload-artifact@v4
        with:
          name: imperialshop-bedrock-resource-pack
          path: dist/imperialshop-bedrock-pack.mcpack
          if-no-files-found: error
      - name: Upload Paper/Purpur JAR
        uses: actions/upload-artifact@v4
        with:
          name: imperialShop-paper-purpur
          path: paper/target/imperialShop.jar
          if-no-files-found: error
      - name: Upload Velocity JAR
        uses: actions/upload-artifact@v4
        with:
          name: imperialShop-velocity
          path: velocity/target/imperialShop-velocity.jar
          if-no-files-found: error