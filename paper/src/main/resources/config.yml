  quantity-title: "&8✦ &bᴛʀᴀɴꜱᴀᴋꜱɪ &8» &f%item%"
  sell-title: "&8✦ &a&lꜱᴇʟʟ &7/ &fʟɪꜱᴛ &8✦"
  sell-input-title: "&8✦ &a&lɪᴍᴘᴇʀɪᴀʟ &f&lꜱᴇʟʟ &7ɢᴜɪ &8✦"

