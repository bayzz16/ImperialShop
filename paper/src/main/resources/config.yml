economy:
  # imperial = ImperialShop owns the Vault economy provider (works without EssentialsX).
  # external = use another plugin registered through Vault.
  # If external is selected but no provider is found, ImperialShop falls back to imperial.
  provider: "imperial"
  currency-name-singular: "Rupiah"
  currency-name-plural: "Rupiah"
  storage:
    # Enable on every Paper/Purpur backend to share one network-wide balance table.
    # Prefer environment variable IMPERIALSHOP_DB_PASSWORD over storing a password here.
    # Shared mode fails closed if database setup/connection fails; it never uses local YAML.
    autosave-ticks: 600
    mysql:
      enabled: false
      host: "127.0.0.1"
      port: 3306
      database: "imperialshop"
      username: "imperialshop"
      password: ""
      table: "imperialshop_balances"
      pool-size: 5

network:
  # Must match the Velocity bridge. Prefer the IMPERIALSHOP_NETWORK_SECRET environment variable in production.
  shared-secret: "CHANGE-ME"

settings:
  currency-symbol: "Rp"
  locale: "id-ID"
  shop-size: 54
  sell-size: 54
  page-size: 45
  quantity-max: 2304
  shop-stack-size: 16
  filler-material: "GRAY_STAINED_GLASS_PANE"
  fill-empty-slots: true
  sounds: true
  # Anti-double-click / transaction spam protection.
  transaction-cooldown-ms: 250
  # Transaksi dengan jumlah di bawah angka ini langsung diproses; jumlah lebih besar meminta konfirmasi.
  confirmation-threshold: 16

# HARD ECONOMY: reward is paid only when the player was hit by that exact mob
# during the fight. Instant/safe kills pay nothing. Values are deliberately small.
