economy:
  # imperial = ImperialShop owns the Vault economy provider.
  # external = use another plugin registered through Vault.
  provider: "external"
  currency-name-singular: "Rupiah"
  currency-name-plural: "Rupiah"
  storage:
    # YAML is the default single-server storage.
    # A shared SQL backend will be added through the economy storage API for multi-server networks.
    autosave-ticks: 600

network:
  # Must match the Velocity bridge. Prefer the IMPERIALSHOP_NETWORK_SECRET environment variable in production.
  shared-secret: "CHANGE-ME"

settings:
  currency-symbol: "Rp"
  locale: "id-ID"
  shop-size: 54
  sell-size: 54
  page-size: 45
  quantity-max: 2304
  shop-stack-size: 16
  filler-material: "GRAY_STAINED_GLASS_PANE"
  fill-empty-slots: true
  sounds: true
  # Anti-double-click / transaction spam protection.
  transaction-cooldown-ms: 250
  # Transaksi dengan jumlah di bawah angka ini langsung diproses; jumlah lebih besar meminta konfirmasi.
  confirmation-threshold: 16

gui:
  main-title: "&8✦ &b&lɪᴍᴘᴇʀɪᴀʟ &f&lꜱʜᴏᴘ &8✦"
