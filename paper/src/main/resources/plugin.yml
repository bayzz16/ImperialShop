name: ImperialShop
version: 2.1.0
main: id.imperial.shop.ImperialShopPlugin
api-version: '1.21'
author: Imperial X SOL
description: Full EconomyShopGUI-style shop and sell system for Paper/Purpur 1.21.x.
depend: [Vault]

commands:
  shop:
    description: Open ImperialShop or a specific category.
    usage: /shop [category|sell|search|favorites|help]
    permission: imperialshop.use
  sell:
    description: Open the ImperialShop Sell GUI.
    usage: /sell
    permission: imperialshop.use
  sellgui:
    description: Open the dedicated item-input Sell GUI.
    usage: /sellgui
    permission: imperialshop.use
  sellall:
    description: Sell all sellable inventory items, a material, or the item in hand.
    usage: /sellall [material|hand]
    permission: imperialshop.use
  sellhand:
    description: Sell the item in your main hand.
    usage: /sellhand
    permission: imperialshop.use
  imperialshop:
    description: ImperialShop administration.
    aliases: [ishop]
    usage: /imperialshop <reload|price|info>
    permission: imperialshop.admin

permissions:
  imperialshop.use:
    description: Use ImperialShop commands and GUI.
    default: true
  imperialshop.shop.all:
    description: Access every configured shop category.
    default: true
  imperialshop.admin:
    description: Manage ImperialShop.
    default: op
  imperialshop.sellgui.all:
    description: Allows selling configured items through /sellgui.
    default: true
  imperialshop.sellall.all:
    description: Allows selling all configured inventory items.
    default: true
  imperialshop.sellallitem.all:
    description: Allows /sellall <material>.
    default: true
  imperialshop.sellallhand.all:
    description: Allows /sellall hand.
    default: true
