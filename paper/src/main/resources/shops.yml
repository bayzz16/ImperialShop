    name: "&4Nether"
    items: [NETHERRACK, SOUL_SAND, SOUL_SOIL, NETHER_BRICKS, NETHER_QUARTZ_ORE, GLOWSTONE_DUST, CRIMSON_STEM, WARPED_STEM, CRIMSON_PLANKS, WARPED_PLANKS, MAGMA_BLOCK, BASALT, BLACKSTONE]
