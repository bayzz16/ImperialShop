    items: [WHEAT, WHEAT_SEEDS, CARROT, POTATO, BEETROOT, BEETROOT_SEEDS, MELON_SLICE, MELON_SEEDS, PUMPKIN, PUMPKIN_SEEDS, SUGAR_CANE, CACTUS, COCOA_BEANS, BAMBOO, KELP, SWEET_BERRIES, GLOW_BERRIES, NETHER_WART]
