# SHOP POLICY
# Hanya item yang tercantum di categories yang dapat ditransaksikan.
# Item rare/endgame/OP tidak masuk BUY maupun SELL.
# Harga disusun dengan ekonomi server berbasis Rupiah: item mudah/farmable bernilai rendah,
# item berisiko/lebih sulit didapat bernilai lebih tinggi, dan harga SELL selalu di bawah BUY.

