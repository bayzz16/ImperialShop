# ImperialShop shop data
# Edit categories, prices, price modifiers, display names and item permissions here.
# This file is intentionally separate from config.yml so shop/economy content can be maintained independently.

price-modifiers:
  vip:
    permission: "imperialshop.modifier.vip"
    buy-multiplier: 0.90
    sell-multiplier: 1.10
  premium:
    permission: "imperialshop.modifier.premium"
    buy-multiplier: 0.85
    sell-multiplier: 1.15

# Optional discount rules. The strongest matching rule is applied per transaction type.
# Buy discount: 0.90 = player pays 90% of the normal buy price.
# Sell bonus: 1.10 = player receives 110% of the normal sell price.
# Each rule may optionally target a category or material.
discounts:
  vip:
    permission: "imperialshop.discount.vip"
    buy-multiplier: 0.95
    sell-multiplier: 1.05
  premium:
    permission: "imperialshop.discount.premium"
    buy-multiplier: 0.90
    sell-multiplier: 1.10

categories:
  blocks:
    material: "STONE"
    name: "&bBlocks"
    items: [STONE, COBBLESTONE, DEEPSLATE, COBBLED_DEEPSLATE, ANDESITE, DIORITE, GRANITE, TUFF, CALCITE, SAND, RED_SAND, GRAVEL, DIRT, GRASS_BLOCK, CLAY, BRICKS, GLASS, GLASS_PANE, OBSIDIAN, OAK_LOG, BIRCH_LOG, SPRUCE_LOG, JUNGLE_LOG, ACACIA_LOG, DARK_OAK_LOG, MANGROVE_LOG, OAK_PLANKS, BIRCH_PLANKS, SPRUCE_PLANKS, JUNGLE_PLANKS, ACACIA_PLANKS, DARK_OAK_PLANKS, MANGROVE_PLANKS, OAK_SLAB, OAK_STAIRS, COBBLESTONE_SLAB, COBBLESTONE_STAIRS]
