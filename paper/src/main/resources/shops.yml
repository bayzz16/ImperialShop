# ImperialShop shop data
# Edit categories, prices, price modifiers, display names and item permissions here.
# This file is intentionally separate from config.yml so shop/economy content can be maintained independently.

price-modifiers:
  vip:
    permission: "imperialshop.modifier.vip"
    buy-multiplier: 0.98
    sell-multiplier: 1.00
  premium:
    permission: "imperialshop.modifier.premium"
    buy-multiplier: 0.95
    sell-multiplier: 1.00

# Optional discount rules. The strongest matching rule is applied per transaction type.
# Buy discount: 0.90 = player pays 90% of the normal buy price.
# Sell bonus: 1.10 = player receives 110% of the normal sell price.
# Each rule may optionally target a category or material.
discounts:
  vip:
    permission: "imperialshop.discount.vip"
    buy-multiplier: 0.98
    sell-multiplier: 1.00
  premium:
    permission: "imperialshop.discount.premium"
    buy-multiplier: 0.95
    sell-multiplier: 1.00

